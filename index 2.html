<style id="restore-admin-add-product-button">
/* Restore the existing admin add-product control hidden by the banner rule; no other changes. */
.intro .primary{visibility:visible!important;opacity:1!important;pointer-events:auto!important;position:absolute!important;z-index:5!important;right:14px!important;bottom:12px!important;top:auto!important;left:auto!important;display:inline-flex!important;min-height:36px!important;padding:6px 12px!important;font-size:12px!important;border:1px solid #e1c27b!important;box-shadow:0 2px 9px #0005!important}

<style id="language-menu-luxury-only">
/* Only the existing language selector; no changes to the rest of the store. */
.header-actions [aria-label="Language"] {
  appearance:none!important;-webkit-appearance:none!important;
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  min-width:104px!important;min-height:43px!important;padding:8px 15px!important;
  border:2px solid #cba458!important;border-radius:13px!important;
  background:linear-gradient(145deg,#fff8df 0%,#efd59a 48%,#c99945 100%)!important;
  color:#243b39!important;font-size:15px!important;font-weight:800!important;
  box-shadow:inset 0 2px 1px #fff9,inset 0 -2px 3px #8a642b55,0 4px 0 #916b30,0 7px 12px #0003!important;
  cursor:pointer!important;position:relative!important;z-index:2!important;
}
.header-actions [aria-label="Language"]:focus-visible {outline:3px solid #4a9b87!important;outline-offset:3px!important}
.header-actions [aria-label="Language"]:active,
.header-actions [aria-label="Language"][data-state="open"] {transform:translateY(2px)!important;box-shadow:inset 0 2px 4px #98753d66,0 2px 0 #916b30!important}
.header-actions [aria-label="Language"] svg {color:#755320!important;width:16px!important;height:16px!important}
/* The dropdown is portalled outside the header, so scope it to the open language trigger. */
body:has(.header-actions [aria-label="Language"][data-state="open"]) [data-slot="select-content"] {
  background:linear-gradient(155deg,#fffdf5,#f6e6bd)!important;
  border:2px solid #cba458!important;border-radius:15px!important;
  padding:6px!important;min-width:132px!important;
  box-shadow:0 10px 24px #0004,inset 0 1px 0 #fff!important;
  overflow:hidden!important;z-index:9999!important;
}
body:has(.header-actions [aria-label="Language"][data-state="open"]) [data-slot="select-item"] {
  display:flex!important;align-items:center!important;min-height:43px!important;
  padding:9px 28px 9px 13px!important;margin:2px 0!important;
  color:#233e3b!important;font-weight:800!important;font-size:15px!important;
  border-radius:9px!important;cursor:pointer!important;
}
body:has(.header-actions [aria-label="Language"][data-state="open"]) [data-slot="select-item"][data-highlighted],
body:has(.header-actions [aria-label="Language"][data-state="open"]) [data-slot="select-item"][data-state="checked"] {
  background:linear-gradient(135deg,#f9e5b4,#e9c57a)!important;color:#392c14!important;
}
@media(max-width:650px){.header-actions [aria-label="Language"]{min-width:88px!important;min-height:40px!important;padding:7px 10px!important;font-size:13px!important}}
</style>
