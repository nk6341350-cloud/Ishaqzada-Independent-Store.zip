<style id="product-dialog-position-fix">
/* Standalone CSS for portalled dialogs: no Tailwind build is served by Pages. */
[data-slot="dialog-overlay"],[data-slot="alert-dialog-overlay"]{position:fixed;inset:0;z-index:100}
[data-slot="dialog-content"],[data-slot="alert-dialog-content"]{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;display:grid;gap:16px;border-radius:20px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);-webkit-overflow-scrolling:touch;pointer-events:auto}
[data-slot="dialog-close"]{position:absolute;display:flex;align-items:center;justify-content:center;width:36px;height:36px;cursor:pointer}
[data-slot="dialog-close"] svg{width:20px;height:20px;pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>

<style id="logo-and-label-polish">
.brand img,.footer-brand img,.access img{display:block;flex-shrink:0;aspect-ratio:1/1;object-fit:cover;object-position:center;border-radius:50%;clip-path:circle(50%);padding:0;overflow:hidden;border:2px solid #c9b382;background:#fff}
.category>span{font-size:15px;font-weight:700;line-height:1.9;color:#344c5b}
.category.active>span{color:#775923}
.share-buttons .whatsapp-btn{font-size:15px;font-weight:700;line-height:1.8;min-height:48px;background:#eaf4ee;color:#24583e;border:1px solid #cfe2d6}
@media(max-width:650px){.category>span{font-size:13px;line-height:1.9;margin-top:8px}.share-buttons .whatsapp-btn{font-size:13px;line-height:1.85;min-height:48px;padding:10px 6px}.share-buttons .whatsapp-btn svg{width:16px;height:16px;flex-shrink:0}}
@media(max-width:360px){.category>span{font-size:14px}.share-buttons .whatsapp-btn{font-size:15px}}
</style>

<style id="hero-brand-refinement">
.topline{display:none}
.intro{padding-inline-end:220px;min-height:210px}
.intro:after{content:"";position:absolute;left:35px;top:50%;transform:translateY(-50%);width:150px;height:150px;border-radius:50%;background:#f5f0e5 url("./logo.jpg") center/cover no-repeat;border:3px solid #d7bf87;box-shadow:0 0 0 7px #d7bf8714}
.intro-mark{display:none}
.intro .eyebrow{font-family:Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.5px;line-height:1.6;color:#e4cd9c;display:block}
@media(max-width:650px){.intro{padding:26px 20px;padding-inline-end:126px;min-height:190px}.intro:after{left:16px;width:90px;height:90px;border-width:2px;box-shadow:0 0 0 5px #d7bf8714}.intro .eyebrow{font-size:13px;letter-spacing:1.2px;line-height:1.7}.intro h1{font-size:26px}.intro p{font-size:12px}}
@media(max-width:360px){.intro{padding-inline-end:105px;padding-inline-start:16px}.intro:after{left:13px;width:73px;height:73px}.intro .eyebrow{font-size:11px;letter-spacing:.8px}.intro h1{font-size:23px}}
</style>
<style id="hero-logo-3d-plaque">
.intro:after{left:24px;width:174px;height:178px;border-radius:9px;border:3px solid #d8bd80;background:#eee5d6 url("./logo.jpg") center/100% auto no-repeat;box-shadow:inset 0 0 0 2px #fff4d5,inset 0 12px 20px #ffffff70,inset 0 -12px 20px #ac874633,5px 5px 0 #927341,9px 10px 15px #0005;transform:translateY(-50%) perspective(650px) rotateY(-7deg)}
@media(max-width:650px){.intro:after{left:10px;width:104px;height:154px;border-radius:7px;border-width:2px;box-shadow:inset 0 0 0 1px #fff4d5,inset 0 10px 16px #ffffff70,inset 0 -10px 16px #ac874633,3px 4px 0 #927341,6px 7px 10px #0005}}
@media(max-width:360px){.intro:after{left:8px;width:85px;height:150px}}
</style>
